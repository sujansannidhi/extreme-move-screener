name: Daily screen

on:
  schedule:
    # 22:30 UTC Mon-Fri = 5:30pm ET (summer) / 4:30pm ET (winter), after the close
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Update prices
        run: python tools/update_yf.py

      - name: Rebuild features
        run: python features.py

      - name: Daily plan
        run: python daily.py

      - name: Build site
        run: python build_site.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ohlcv_full.csv.gz out/plan_*.csv public/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily screen $(date -u +%Y-%m-%d)"
            git push
          fi
